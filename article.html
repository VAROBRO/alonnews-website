<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALON NEWS</title><style>:root{--bg:#07070d;--panel:#11111b;--line:#282836;--ink:#f4f3fb;--muted:#aaa9b8;--acid:#c7ff3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.wrap{width:min(840px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}nav{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-weight:950;letter-spacing:-.06em;font-size:1.35rem}.brand i{font-style:normal;background:var(--acid);color:#111;padding:2px 7px;border-radius:6px;margin-right:3px}.back{float:right;color:var(--muted);font-size:.85rem;font-weight:800}.back:hover{color:var(--acid)}main{padding:55px 0 90px}.meta{color:var(--acid);font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;font-weight:900}.headline{font-size:clamp(2.6rem,6.5vw,5.3rem);line-height:.92;letter-spacing:-.075em;margin:15px 0 24px}.deck{color:#c5c4cf;font-size:1.15rem;line-height:1.65;max-width:720px}.visual{height:min(420px,56vw);border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 25% 18%,rgba(199,255,61,.38),transparent 26%),radial-gradient(circle at 75% 75%,rgba(140,101,255,.55),transparent 35%),#171726;margin:35px 0}.article{max-width:700px;font-size:1.1rem;line-height:1.8;color:#d0cfd8}.article p{margin:0 0 24px}.source{margin-top:36px;border-left:3px solid var(--acid);padding:16px 18px;background:var(--panel);font-size:.9rem;line-height:1.6}.source a{color:var(--acid);font-weight:900}.lang{float:right;margin-right:18px}.lang button{background:none;border:1px solid var(--line);color:var(--ink);padding:5px 8px;cursor:pointer}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.8rem}</style></head><body><nav><div class="wrap"><a class="brand" href="index.html"><i>A</i>LON NEWS</a><span class="lang"><button onclick="render('en')">EN</button><button onclick="render('es')">ES</button></span><a class="back" href="index.html">← Latest</a></div></nav><main><div class="wrap"><div class="meta" id="meta"></div><h1 class="headline" id="title"></h1><p class="deck" id="deck"></p><div class="visual"></div><article class="article" id="body"></article><div class="source" id="source"></div></div></main><footer><div class="wrap">© 2026 ALON NEWS · Independent gaming coverage</div></footer><script>let story;let language='en';async function load(){const slug=new URLSearchParams(location.search).get('slug');const data=await fetch('articles.json').then(r=>r.json());story=data.articles.find(x=>x.slug===slug);if(!story){document.querySelector('main').innerHTML='<div class="wrap"><h1>Story not found.</h1></div>';return}render('en')}function render(lang){if(!story)return;language=lang;document.documentElement.lang=lang;const es=lang==='es';meta.textContent=story.category+' · ALON NEWS';title.textContent=es?story.title_es:story.title_en;deck.textContent=es?story.dek_es:story.dek_en;body.innerHTML=(es?story.body_es:story.body_en).map(p=>'<p>'+p+'</p>').join('');source.innerHTML=(es?'Fuentes e información: ':'Sources & reporting: ')+'<a target="_blank" rel="noopener" href="'+story.source_url+'">'+story.source_name+' →</a><br><span>'+(es?'Artículo editorial original de ALON NEWS.':'Original ALON NEWS editorial article.')+'</span>'}load().catch(()=>document.querySelector('main').innerHTML='<div class="wrap"><h1>Edition is loading.</h1></div>')</script></body></html>
