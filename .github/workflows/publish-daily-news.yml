name: Publish ALON NEWS daily edition

on:
  schedule:
    - cron: "0 14 * * *" # 7:00 AM Arizona (MST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build daily edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: node scripts/publish-news.mjs
      - name: Commit edition
        run: |
          git config user.name "ALON NEWS Desk"
          git config user.email "newsbot@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || git commit -m "Publish daily ALON NEWS edition"
          git push