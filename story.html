<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALON NEWS</title><style>
:root{--bg:#0b0e13;--panel:#131923;--line:#293241;--ink:#f5f7fa;--muted:#aeb7c3;--accent:#e3222b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(900px,calc(100% - 38px));margin:auto}a{color:inherit;text-decoration:none}nav{border-top:5px solid var(--accent);border-bottom:1px solid var(--line);padding:20px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:950;letter-spacing:-.065em;font-size:1.55rem}.brand b{color:var(--accent)}.back{font-weight:700;color:var(--muted);font-size:.9rem}.back:hover{color:#fff}main{padding:56px 0 86px}.meta{color:#ff5a60;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900}.headline{font-size:clamp(2.45rem,6vw,5.4rem);line-height:.94;letter-spacing:-.075em;margin:15px 0 22px;max-width:840px}.deck{color:#d1d7df;font-size:clamp(1.05rem,2vw,1.26rem);line-height:1.58;max-width:760px;margin:0}.visual{margin:36px 0 8px}.visual img{width:100%;max-height:510px;object-fit:cover;display:block;border:1px solid var(--line);border-radius:4px}.credit{display:block;color:var(--muted);font-size:.76rem;margin:9px 2px 0}.article{max-width:720px;font-size:1.1rem;line-height:1.82;color:#d6dbe2;margin-top:32px}.article p{margin:0 0 24px}.source{max-width:720px;margin-top:34px;border-left:3px solid var(--accent);padding:15px 18px;background:var(--panel);font-size:.9rem;line-height:1.6}.source a{color:#ff7075;font-weight:800}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.8rem}@media(max-width:600px){main{padding-top:38px}.visual{margin-top:27px}.headline{font-size:2.55rem}}
</style></head><body><nav><div class="wrap bar"><a class="brand" href="index.html"><b>ALON</b> NEWS</a><a class="back" href="index.html">← Back to latest</a></div></nav><main><div class="wrap"><div class="meta" id="meta"></div><h1 class="headline" id="title"></h1><p class="deck" id="deck"></p><figure class="visual" id="visual"></figure><article class="article" id="body"></article><div class="source" id="source"></div></div></main><footer><div class="wrap">© 2026 ALON NEWS · Independent gaming coverage</div></footer><script>
const stories={
metroid:{tag:"Console / Fan Scene",title:"A fan-made 2D take on Metroid Prime arrives after years under wraps.",deck:"An unofficial project turns a first-person classic into a side-scrolling adventure — and brings fresh attention to the community work surrounding Nintendo’s sci-fi series.",image:"https://www.videogameschronicle.com/files/2021/04/prime-2d.jpg",credit:"Prime 2D project screenshot · Team SCU / Video Games Chronicle",body:["Fan projects occupy a peculiar part of the games landscape: they are celebrations, technical exercises and community events all at once. This newly released 2D reinterpretation borrows the atmosphere and exploratory pull associated with Metroid Prime, then rebuilds that experience for a side-scrolling format.","The point is not to confuse it with an official Nintendo release. It is to recognise the persistence behind a project developed outside a major studio, and the way these works keep a franchise’s ideas in circulation between official releases."],source:"Video Games Chronicle",url:"https://www.videogameschronicle.com/news/metroid-prime-2d-fan-game-prime-2d-released-after-six-years-of-development/"},
gta:{tag:"PC / Industry",title:"Rockstar’s GTA 6 leak fight remains a live story.",deck:"The conversation around one of gaming’s biggest upcoming launches continues to be shaped by the difficult reality of controlling information online.",image:"https://www.rockstargames.com/VI/_next/static/media/poster_full.0az_iud2g3y4j.jpg?akim=1&imdensity=1&imwidth=1920",credit:"Official Grand Theft Auto VI artwork · Rockstar Games",body:["Leaks are more than a marketing nuisance for the industry’s largest releases: they can define a game’s public narrative long before its publisher is ready to speak. The continued discussion around GTA 6 is a reminder that information now travels through official channels, social platforms and a relentless flow of unofficial material.","For studios, the challenge is not simply stopping early discussion. It is preserving a clear line between confirmed detail and speculation, while players wait for the next official update."],source:"Rockstar Games",url:"https://www.rockstargames.com/VI"},
eterspire:{tag:"Mobile",title:"Eterspire’s new update leans into rabbits and wolves.",deck:"A new content update keeps the mobile MMO in the live-service conversation, where regular reasons to return matter as much as a game’s original launch.",image:"https://i0.wp.com/gamingonphone.com/wp-content/uploads/2023/02/Eterspire-Beginners-Guide-.jpg",credit:"Eterspire gameplay · GamingonPhone",body:["Mobile games live or die on their rhythm. New activities, themes and social moments are not simply extras; they give a community a reason to check in again. The latest Eterspire update is the kind of signal that matters in a genre built on steady momentum.","For anyone tracking mobile games, ongoing support often says more about a title’s direction than a single announcement. The interesting question is whether fresh content gives existing players a reason to stay — and new ones a reason to try it."],source:"Pocket Gamer",url:"https://www.pocketgamer.com/"},
psplus:{tag:"Console / Platform",title:"PS Plus cloud play is being tested on Steam Deck through a third-party app.",deck:"Streaming libraries continue to blur the boundaries between platforms, devices and subscriptions.",image:"https://blog.playstation.com/tachyon/2023/10/b7397b602b3cc2c8155728169f30686481259491.jpg",credit:"PlayStation cloud streaming artwork · Sony Interactive Entertainment",body:["The latest SteamOS and Linux-focused experiment is about access: allowing eligible PlayStation catalogue games to be streamed on hardware people already carry. It is an early-stage route rather than a replacement for the official platform experience.","The story is a useful snapshot of where gaming hardware is heading. The device in a player’s hands increasingly matters less than the library and network connection behind it — while quality, pricing and compatibility still determine whether that promise holds up."],source:"PlayStation Blog",url:"https://blog.playstation.com/"}
};
const q=new URLSearchParams(location.search).get("story");const s=stories[q]||stories.metroid;document.title=s.title+" — ALON NEWS";meta.textContent=s.tag+" · 23 AUG 2026";title.textContent=s.title;deck.textContent=s.deck;visual.innerHTML='<img src="'+s.image+'" alt="'+s.title+'"><figcaption class="credit">Image: '+s.credit+'</figcaption>';body.innerHTML=s.body.map(p=>"<p>"+p+"</p>").join("");source.innerHTML='Reporting and source material: <a target="_blank" rel="noopener" href="'+s.url+'">'+s.source+' →</a><br><span>Original ALON NEWS editorial coverage. Image credit is shown above.</span>';
</script></body></html>
